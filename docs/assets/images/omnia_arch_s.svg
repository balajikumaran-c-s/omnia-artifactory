<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title description">
  <title id="title">Omnia modular deployment architecture</title>
  <desc id="description">Aligned architecture diagram showing BuildStreaM, Repo Manager, Image Build Manager, and Orchestrator on the Omnia Infrastructure Manager, with catalog-selected services deployed to cluster nodes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b2d4d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0076ce"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f26b21"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .boundary { fill: #f8fbfe; stroke: #0076ce; stroke-width: 2; }
      .node-boundary { fill: #fffaf6; stroke: #f26b21; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #a8c4da; stroke-width: 1.5; filter: url(#shadow); }
      .module-head { fill: #0076ce; }
      .module-title { fill: #ffffff; font: 700 17px Arial, sans-serif; text-anchor: middle; }
      .section-title { fill: #003b64; font: 700 21px Arial, sans-serif; text-anchor: middle; }
      .node-section-title { fill: #b54708; font: 700 19px Arial, sans-serif; text-anchor: middle; }
      .node-title { fill: #003b64; font: 700 15px Arial, sans-serif; text-anchor: middle; }
      .chip { fill: #d9f4f8; stroke: #37bfd2; stroke-width: 1.25; }
      .chip-text { fill: #17324d; font: 14px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #40566b; font: 13px Arial, sans-serif; text-anchor: middle; }
      .external { fill: #ffffff; stroke: #0076ce; stroke-width: 1.5; filter: url(#shadow); }
      .external-title { fill: #17324d; font: 700 16px Arial, sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #0076ce; stroke-width: 2; marker-end: url(#arrow-blue); }
      .deploy-flow { fill: none; stroke: #f26b21; stroke-width: 2; marker-end: url(#arrow-orange); }
      .bus { fill: none; stroke: #f26b21; stroke-width: 2; }
      .note { fill: #40566b; font: 14px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="740"/>

  <!-- External services -->
  <rect class="external" x="20" y="118" width="96" height="42" rx="8"/>
  <text class="external-title" x="68" y="145">GitLab</text>
  <path class="flow" d="M116 139 H145"/>

  <ellipse class="external" cx="68" cy="508" rx="52" ry="25"/>
  <text class="external-title" x="68" y="514">PowerScale</text>
  <path class="deploy-flow" d="M120 508 H142"/>

  <!-- OIM -->
  <rect class="boundary" x="135" y="22" width="1125" height="288" rx="28"/>
  <text class="section-title" x="697.5" y="51">Omnia Infrastructure Manager (OIM)</text>

  <!-- BuildStreaM -->
  <rect class="card" x="150" y="72" width="190" height="204" rx="16"/>
  <path class="module-head" d="M150 88 A16 16 0 0 1 166 72 H324 A16 16 0 0 1 340 88 V112 H150 Z"/>
  <text class="module-title" x="245" y="98">BuildStreaM</text>
  <rect class="chip" x="168" y="128" width="154" height="34" rx="7"/>
  <text class="chip-text" x="245" y="150">BSM API</text>
  <rect class="chip" x="168" y="174" width="154" height="34" rx="7"/>
  <text class="chip-text" x="245" y="196">PostgreSQL</text>
  <rect class="chip" x="168" y="220" width="154" height="34" rx="7"/>
  <text class="chip-text" x="245" y="242">GitLab integration</text>

  <!-- Repo Manager -->
  <rect class="card" x="370" y="72" width="200" height="204" rx="16"/>
  <path class="module-head" d="M370 88 A16 16 0 0 1 386 72 H554 A16 16 0 0 1 570 88 V112 H370 Z"/>
  <text class="module-title" x="470" y="98">Repo Manager</text>
  <rect class="chip" x="388" y="128" width="164" height="34" rx="7"/>
  <text class="chip-text" x="470" y="150">Catalog resolution</text>
  <rect class="chip" x="388" y="174" width="164" height="34" rx="7"/>
  <text class="chip-text" x="470" y="196">Content synchronization</text>
  <rect class="chip" x="388" y="220" width="164" height="34" rx="7"/>
  <text class="chip-text" x="470" y="242">Pulp repositories</text>

  <!-- Image Build Manager -->
  <rect class="card" x="600" y="72" width="220" height="204" rx="16"/>
  <path class="module-head" d="M600 88 A16 16 0 0 1 616 72 H804 A16 16 0 0 1 820 88 V112 H600 Z"/>
  <text class="module-title" x="710" y="98">Image Build Manager</text>
  <rect class="chip" x="618" y="128" width="184" height="34" rx="7"/>
  <text class="chip-text" x="710" y="150">OS image builders</text>
  <rect class="chip" x="618" y="174" width="184" height="34" rx="7"/>
  <text class="chip-text" x="710" y="196">MinIO / S3</text>
  <rect class="chip" x="618" y="220" width="184" height="34" rx="7"/>
  <text class="chip-text" x="710" y="242">OCI registry</text>

  <!-- Orchestrator -->
  <rect class="card" x="850" y="72" width="200" height="204" rx="16"/>
  <path class="module-head" d="M850 88 A16 16 0 0 1 866 72 H1034 A16 16 0 0 1 1050 88 V112 H850 Z"/>
  <text class="module-title" x="950" y="98">Orchestrator</text>
  <rect class="chip" x="868" y="128" width="164" height="34" rx="7"/>
  <text class="chip-text" x="950" y="150">PXE mapping</text>
  <rect class="chip" x="868" y="174" width="164" height="34" rx="7"/>
  <text class="chip-text" x="950" y="196">OpenCHAMI</text>
  <rect class="chip" x="868" y="220" width="164" height="34" rx="7"/>
  <text class="chip-text" x="950" y="242">Node provisioning</text>

  <!-- Catalog-selected capabilities -->
  <rect class="card" x="1080" y="72" width="160" height="204" rx="16"/>
  <path class="module-head" d="M1080 88 A16 16 0 0 1 1096 72 H1224 A16 16 0 0 1 1240 88 V112 H1080 Z"/>
  <text class="module-title" x="1160" y="91">
    <tspan x="1160" dy="0">Catalog-selected</tspan>
    <tspan x="1160" dy="18">software</tspan>
  </text>
  <rect class="chip" x="1097" y="128" width="126" height="26" rx="6"/>
  <text class="chip-text" x="1160" y="146">GPU</text>
  <rect class="chip" x="1097" y="162" width="126" height="26" rx="6"/>
  <text class="chip-text" x="1160" y="180">Authentication</text>
  <rect class="chip" x="1097" y="196" width="126" height="26" rx="6"/>
  <text class="chip-text" x="1160" y="214">Storage</text>
  <rect class="chip" x="1097" y="230" width="126" height="26" rx="6"/>
  <text class="chip-text" x="1160" y="248">Cluster software</text>

  <!-- Module flow -->
  <path class="flow" d="M340 174 H368"/>
  <path class="flow" d="M570 174 H598"/>
  <path class="flow" d="M820 174 H848"/>

  <!-- Provisioning bus -->
  <path class="deploy-flow" d="M950 276 V335"/>
  <path class="bus" d="M232 335 H1147"/>

  <!-- Provisioned nodes -->
  <rect class="node-boundary" x="135" y="350" width="1125" height="318" rx="28"/>
  <text class="node-section-title" x="697.5" y="381">Omnia Provisioned Nodes</text>

  <!-- Service Kubernetes control plane -->
  <path class="deploy-flow" d="M232 335 V397"/>
  <rect class="card" x="150" y="397" width="164" height="238" rx="16"/>
  <text class="node-title" x="232" y="425">
    <tspan x="232">Service Kubernetes</tspan>
    <tspan x="232" dy="18">Control Plane</tspan>
  </text>
  <rect class="chip" x="164" y="467" width="136" height="32" rx="7"/>
  <text class="chip-text" x="232" y="488">Kubernetes</text>
  <rect class="chip" x="164" y="511" width="136" height="32" rx="7"/>
  <text class="chip-text" x="232" y="532">NFS</text>
  <rect class="chip" x="164" y="555" width="136" height="48" rx="7"/>
  <text class="chip-text" x="232" y="576">
    <tspan x="232">Telemetry and</tspan>
    <tspan x="232" dy="17">logging</tspan>
  </text>

  <!-- Service Kubernetes worker -->
  <path class="deploy-flow" d="M415 335 V397"/>
  <rect class="card" x="333" y="397" width="164" height="238" rx="16"/>
  <text class="node-title" x="415" y="425">
    <tspan x="415">Service Kubernetes</tspan>
    <tspan x="415" dy="18">Worker</tspan>
  </text>
  <rect class="chip" x="347" y="467" width="136" height="32" rx="7"/>
  <text class="chip-text" x="415" y="488">Kubernetes</text>
  <rect class="chip" x="347" y="511" width="136" height="32" rx="7"/>
  <text class="chip-text" x="415" y="532">NFS</text>
  <rect class="chip" x="347" y="555" width="136" height="48" rx="7"/>
  <text class="chip-text" x="415" y="576">
    <tspan x="415">Telemetry and</tspan>
    <tspan x="415" dy="17">logging</tspan>
  </text>

  <!-- Minimal OS -->
  <path class="deploy-flow" d="M598 335 V397"/>
  <rect class="card" x="516" y="397" width="164" height="238" rx="16"/>
  <text class="node-title" x="598" y="434">Minimal OS</text>
  <rect class="chip" x="530" y="467" width="136" height="48" rx="7"/>
  <text class="chip-text" x="598" y="487">
    <tspan x="598">OpenLDAP</tspan>
    <tspan x="598" dy="17">client</tspan>
  </text>
  <rect class="chip" x="530" y="527" width="136" height="48" rx="7"/>
  <text class="chip-text" x="598" y="547">
    <tspan x="598">LDMS</tspan>
    <tspan x="598" dy="17">producer</tspan>
  </text>

  <!-- Slurm controller -->
  <path class="deploy-flow" d="M781 335 V397"/>
  <rect class="card" x="699" y="397" width="164" height="238" rx="16"/>
  <text class="node-title" x="781" y="425">
    <tspan x="781">Slurm Controller</tspan>
    <tspan x="781" dy="18">Node</tspan>
  </text>
  <rect class="chip" x="713" y="467" width="136" height="32" rx="7"/>
  <text class="chip-text" x="781" y="488">Slurm</text>
  <rect class="chip" x="713" y="511" width="136" height="32" rx="7"/>
  <text class="chip-text" x="781" y="532">NFS</text>
  <rect class="chip" x="713" y="555" width="136" height="48" rx="7"/>
  <text class="chip-text" x="781" y="575">
    <tspan x="781">OpenLDAP client</tspan>
    <tspan x="781" dy="17">LDMS producer</tspan>
  </text>

  <!-- Login/compiler -->
  <path class="deploy-flow" d="M964 335 V397"/>
  <rect class="card" x="882" y="397" width="164" height="238" rx="16"/>
  <text class="node-title" x="964" y="425">
    <tspan x="964">Login / Compiler</tspan>
    <tspan x="964" dy="18">Nodes</tspan>
  </text>
  <rect class="chip" x="896" y="467" width="136" height="32" rx="7"/>
  <text class="chip-text" x="964" y="488">Slurm / CUDA</text>
  <rect class="chip" x="896" y="511" width="136" height="32" rx="7"/>
  <text class="chip-text" x="964" y="532">NFS / OpenLDAP</text>
  <rect class="chip" x="896" y="555" width="136" height="48" rx="7"/>
  <text class="chip-text" x="964" y="575">
    <tspan x="964">UCX / OpenMPI</tspan>
    <tspan x="964" dy="17">LDMS producer</tspan>
  </text>

  <!-- Slurm compute -->
  <path class="deploy-flow" d="M1147 335 V397"/>
  <rect class="card" x="1065" y="397" width="164" height="238" rx="16"/>
  <text class="node-title" x="1147" y="425">
    <tspan x="1147">Slurm Compute</tspan>
    <tspan x="1147" dy="18">Nodes</tspan>
  </text>
  <rect class="chip" x="1079" y="467" width="136" height="32" rx="7"/>
  <text class="chip-text" x="1147" y="488">Slurm / CUDA</text>
  <rect class="chip" x="1079" y="511" width="136" height="32" rx="7"/>
  <text class="chip-text" x="1147" y="532">NFS / OpenLDAP</text>
  <rect class="chip" x="1079" y="555" width="136" height="48" rx="7"/>
  <text class="chip-text" x="1147" y="575">LDMS producer</text>

  <text class="note" x="640" y="701">Modules run from the OIM; Orchestrator applies catalog-selected images and services to the provisioned nodes.</text>
  <text class="note" x="640" y="724">PowerScale is optional. Telemetry runs on the service Kubernetes cluster when enabled.</text>
</svg>
